<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة التحف التقنية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: #1a73e8; }
        .post-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-right: 5px solid #1a73e8; }
        .post-title { margin: 0 0 10px 0; color: #333; }
        .post-date { font-size: 0.85em; color: #666; margin-bottom: 15px; }
        .post-content { color: #444; line-height: 1.6; }
        .loading { text-align: center; font-size: 1.2em; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>مرحباً بكم في مدونتي 🚀</h1>
    <div id="blog-posts" class="loading">جاري جلب المقالات من المستودع...</div>
</div>

<script>
    async function fetchMyPosts() {
        const container = document.getElementById('blog-posts');
        // تأكد أن هذه البيانات تطابق حسابك 100%
        const username = "seif1hamdy028-lab";
        const repo = "tech-artifacts";
        const folder = "posts";

        try {
            // 1. جلب قائمة الملفات من فولدر posts
            const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folder}`);
            
            if (!response.ok) throw new Error("لا توجد مقالات حالياً");

            const files = await response.json();
            container.innerHTML = ""; // مسح كلمة جاري التحميل

            // 2. قراءة كل ملف .md وعرضه
            for (const file of files) {
                if (file.name.endsWith('.md')) {
                    const contentResponse = await fetch(file.download_url);
                    const rawText = await contentResponse.text();

                    // استخراج العنوان والتاريخ والمحتوى ببساطة
                    const title = rawText.match(/title:\s*(.*)/)?.[1]?.replace(/['"]/g, '') || "عنوان غير معروف";
                    const date = rawText.match(/date:\s*(.*)/)?.[1] || "تاريخ غير معروف";
                    const content = rawText.split('---').pop().trim();

                    // إضافة المقال للصفحة
                    const postHTML = `
                        <div class="post-card">
                            <h2 class="post-title">${title}</h2>
                            <div class="post-date">📅 تاريخ النشر: ${date}</div>
                            <div class="post-content">${content.substring(0, 200)}...</div>
                        </div>
                    `;
                    container.innerHTML += postHTML;
                }
            }
        } catch (error) {
            container.innerHTML = `<p style="text-align:center">لم يتم العثور على مقالات. تأكد من وجود مجلد باسم <b>posts</b> داخل مستودعك وبه ملفات تنتهي بـ <b>.md</b></p>`;
        }
    }

    fetchMyPosts();
</script>
<h1>hi seif</h1>
</body>
</html>
