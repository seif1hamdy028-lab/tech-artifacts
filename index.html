<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة التحف التقنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --accent-color: #ff6d00;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-main);
        }

        /* رأس الصفحة */
        header {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 2.5rem; }
        header p { opacity: 0.9; margin-top: 10px; }

        /* منطقة البحث */
        .search-section {
            max-width: 600px;
            margin: -30px auto 40px;
            padding: 0 20px;
        }

        #searchBar {
            width: 100%;
            padding: 18px 30px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-size: 1.1rem;
            outline: none;
            font-family: 'Tajawal', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px 50px;
        }

        /* تنظيم المقالات في شبكة */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        .post-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.08);
        }

        .post-info {
            padding: 25px;
            flex-grow: 1;
        }

        .post-title {
            font-size: 1.4rem;
            color: #1e293b;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .post-content {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #64748b;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #64748b;
        }

        /*Responsive*/
        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .posts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>مدونة التحف التقنية 🚀</h1>
    <p>بوابتك نحو عالم البرمجة والابتكار</p>
</header>

<div class="search-section">
    <input type="text" id="searchBar" placeholder="ابحث عن مقال معين..." onkeyup="filterPosts()">
</div>

<div class="container">
    <div id="blog-posts" class="posts-grid">
        <div class="loading">جاري جلب المقالات الذكية...</div>
    </div>
</div>

<script>
    let postsData = []; // لتخزين المقالات محلياً للبحث السريع

    async function fetchMyPosts() {
        const container = document.getElementById('blog-posts');
        const username = "seif1hamdy028-lab";
        const repo = "tech-artifacts";
        const folder = "posts";

        try {
            const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folder}`);
            if (!response.ok) throw new Error("لا توجد مقالات حالياً");

            const files = await response.json();
            postsData = []; 

            for (const file of files) {
                if (file.name.endsWith('.md')) {
                    const contentResponse = await fetch(file.download_url);
                    const rawText = await contentResponse.text();

                    const title = rawText.match(/title:\s*(.*)/)?.[1]?.replace(/['"]/g, '') || "عنوان غير معروف";
                    const date = rawText.match(/date:\s*(.*)/)?.[1] || "تاريخ غير معروف";
                    const content = rawText.split('---').pop().trim();

                    postsData.push({ title, date, content });
                }
            }
            renderPosts(postsData);
        } catch (error) {
            container.innerHTML = `<p class="loading">حدث خطأ أثناء تحميل المقالات. تأكد من وجود مجلد posts بشكل صحيح.</p>`;
        }
    }

    function renderPosts(articles) {
        const container = document.getElementById('blog-posts');
        container.innerHTML = ""; 

        if (articles.length === 0) {
            container.innerHTML = `<p class="loading">لا توجد نتائج تطابق بحثك 🔍</p>`;
            return;
        }

        articles.forEach(post => {
            const postHTML = `
                <div class="post-card">
                    <div class="post-info">
                        <div class="post-date">📅 ${post.date}</div>
                        <h2 class="post-title">${post.title}</h2>
                        <div class="post-content">${post.content.substring(0, 150)}...</div>
                    </div>
                </div>
            `;
            container.innerHTML += postHTML;
        });
    }

    // وظيفة البحث الذكي
    function filterPosts() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const filtered = postsData.filter(p => 
            p.title.toLowerCase().includes(query) || 
            p.content.toLowerCase().includes(query)
        );
        renderPosts(filtered);
    }

    fetchMyPosts();
</script>

</body>
</html>
