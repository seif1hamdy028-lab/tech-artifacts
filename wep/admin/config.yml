backend:
  name: git-gateway
  branch: main # تأكد أن هذا هو اسم الفرع في GitHub (غالباً main أو master)

media_folder: "images" # المجلد الذي ستُحفظ فيه الصور
public_folder: "/images"

collections:
  - name: "blog"
    label: "المقالات"
    folder: "posts" # المجلد الذي ستُحفظ فيه المقالات كملفات Markdown
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime" }
      - { label: "محتوى المقال", name: "body", widget: "markdown" }